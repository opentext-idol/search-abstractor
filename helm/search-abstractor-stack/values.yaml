global:
  # -- Global secrets used to pull container images
  # @section -- Global Values
  imagePullSecrets:
  - "dockerhub-secret"

aes:
  # -- Value used to generate a shared AES256 key for securityinfo
  key: search-abstractor
  # @ignored DRY definitions
  common:
    volume: &x-aes-key-volume
      aes-key-volume:
        name: aes-key-files
        configMap:
          name: search-abstractor-security-aes-key
    volumeMount: &x-aes-key-volumeMount
      name: aes-key-files
      subPath: aes.keyfile

# -- `content` subchart values (see https://github.com/opentext-idol/idol-containers-toolkit/tree/main/helm/single-content#values)
# @default -- default configuration for search-abstractor content
content:
  # -- Whether to deploy a content component
  enabled: true
  name: idol-content
  idolImage:
    version: &idolVersion "25.2.0"
  queryserviceACIPort: &queryserviceACIPort "9100"
  existingConfigMap: search-abstractor-content-deployment-cfg
  cfg:
    # -- Additional Content field processing configuration data
    # @default -- ""
    fieldprocessing: |-
      // add additional Content field setup here (appended to [FieldProcessing] section)
    # -- Additional Content security configuration data
    # @default -- ""
    security: |-
      // add additional Content security setup here (appended to [Security] section)
  additionalVolumes:
    <<: *x-aes-key-volume
  additionalVolumeMounts:
    aes-key-volumeMount:
      <<: *x-aes-key-volumeMount
      mountPath: /opt/idol/content/index/aes.keyfile

# -- `distributed-idol` subchart values (see https://github.com/opentext-idol/idol-containers-toolkit/tree/main/helm/distributed-idol#values)
# @default -- default configuration for search-abstractor distributed-idol
distributedidol:
  # -- Whether to deploy a distributed-idol component (either this or content should be enabled, but not both)
  enabled: false
  name: distributed-idol
  content:
    name: idol-content
    idolImage:
      version: *idolVersion
    existingConfigMap: search-abstractor-content-deployment-cfg
    initialEngineCount: "3"
    aciPort: "9100"
    indexPort: "9101"
    servicePort: "9102"
    additionalVolumes:
      <<: *x-aes-key-volume
    additionalVolumeMounts:
      aes-key-volumeMount:
        <<: *x-aes-key-volumeMount
        mountPath: /opt/idol/content/index/aes.keyfile
  dah:
    name: idol-dah
    idolImage:
      version: *idolVersion
    existingConfigMap: search-abstractor-distributed-idol-dah-deployment-cfg
    aciPort: *queryserviceACIPort
    servicePort: "9102"
  dih:
    name: idol-dih
    idolImage:
      version: *idolVersion
    existingConfigMap: search-abstractor-distributed-idol-dih-deployment-cfg
    aciPort: "9070"
    servicePort: "9072"

# -- `answerserver` subchart values (see https://github.com/opentext-idol/idol-containers-toolkit/tree/main/helm/idol-answerserver#values)
# @default -- default configuration for search-abstractor answerserver
answerserver:
  # -- Whether to deploy an Answer Server component
  enabled: true
  idolImage:
    repo: answerserver-searchabstractor
    version: &saAciVersion "25.2.4"
  single-content:
    enabled: false
  factbank:
    # -- whether to enable factbank answer system. See also answerserver.postgresql.enabled.
    enabled: &factbank-enabled false
    # -- Connection string for factbank postgres database - set if you want to use an external database rather than deploy one here
    psqlConnectionString: ""
    # -- Connection string for factbank codings postgres database - set if you want to use a separate external database for codings
    codingsPsqlConnectionString: ""
  postgresql:
    # -- whether to enable backing postgresl for factbank answer system. See also answerserver.factbank.enabled.
    enabled: *factbank-enabled
  answerbank:
    # -- whether to enable answerbank answer system. See also answerserver.answserbankAgentstore.enabled.
    enabled: &answerbank-enabled false
  answerbankAgentstore:
    # -- whether to enable backing agentstore for answerbank answer system. See also answerserver.answserbankAgentstore.enabled.
    enabled: *answerbank-enabled
    idolImage:
      version: *idolVersion
  passageextractorAgentstore:
    enabled: false
    idolImage:
      version: *idolVersion
  existingConfigMap: search-abstractor-answerserver-deployment-cfg
  additionalVolumes:
    idol-answerserver-scripts:
      name: idol-answerserver-scripts
      configMap:
        name: idol-answerserver-scripts
    search-abstractor-answerserver-deployment-resources-cfg:
      name: search-abstractor-answerserver-deployment-resources-cfg
      configMap:
        name: search-abstractor-answerserver-deployment-resources-cfg
  additionalVolumeMounts:
    idol-answerserver-scripts:
      name: idol-answerserver-scripts
      mountPath: /answerserver/prestart_scripts/00_config.sh
      subPath: config.sh
    search-abstractor-answerserver-deployment-resources-cfg:
      name: search-abstractor-answerserver-deployment-resources-cfg
      mountPath: /answerserver/resources/llmdata
  envConfigMap: search-abstractor-answerserver-deployment-env-cfg

# -- `qms` subchart values (see https://github.com/opentext-idol/idol-containers-toolkit/tree/main/helm/idol-qms#values)
# @default -- default configuration for search-abstractor qms
qms:
  # -- Whether to deploy a QMS component
  enabled: true
  queryserviceSSLMethod: None
  idolImage:
    repo: qms-searchabstractor
    version: *saAciVersion
  aciPort: &qms-aci-port "16000"
  singleAgentstore:
    enabled: false
  single-content:
    enabled: false
  existingConfigMap: search-abstractor-qms-deployment-cfg
  additionalVolumes:
    poststart:
      name: poststart
      configMap:
        name: idol-qms-poststart
  additionalVolumeMounts:
    poststart:
      name: poststart
      mountPath: /qms/poststart_scripts

# -- `omnigroupserver` subchart values (see https://github.com/opentext-idol/idol-containers-toolkit/tree/main/helm/idol-omnigroupserver#values)
# @default -- default configuration for search-abstractor omnigroupserver
ogs:
  # -- Whether to deploy an OmniGroupServer component
  enabled: true
  existingConfigMap: search-abstractor-ogs-deployment-cfg
  oauthToolConfigMap: search-abstractor-ogs-deployment-oauth-cfg
  idolImage:
    version: *idolVersion
  cfg:
    # -- Set to `true` to completely overwrite default [Repositories] settings
    overwrite: false
    # -- additional omnigroupserver repositories configuration data
    repositories: |-
      // add your OmniGroupServer repo setup here (appended to [Repositories] section)
      // start numbering at 1=... unless overwriting (0 is the OTDS repository config)
    # -- additional OTDS configuration data
    otds: |-
      // appended to the [OTDS] repository configuration section

# -- `community` subchart values (see https://github.com/opentext-idol/idol-containers-toolkit/tree/main/helm/idol-community#values)
# @default -- default configuration for search-abstractor community
community:
  # -- Whether to deploy Community component
  enabled: true
  name: &community-name idol-community
  idolImage:
    version: *idolVersion
  aciPort: &community-aciport "9030"
  queryserviceACIPort: *queryserviceACIPort
  queryserviceSSLMethod: None
  agentStoreName: "idol-content"
  agentStoreACIPort: *queryserviceACIPort
  existingConfigMap: search-abstractor-community-deployment-cfg
  cfg:
    # -- Set to `true` to completely overwrite default [Security] settings
    overwrite: false
    # -- Additional Community security configuration data
    security: |-
      // add your community security setup here (appended to [Security] section)
    # -- Additional OTDS security repository settings
    otds: |-
      // add you OTDS security settings here (appended to [OTDS] section)
  additionalVolumes:
    <<: *x-aes-key-volume  
  additionalVolumeMounts:
    aes-key-volumeMount:
      <<: *x-aes-key-volumeMount
      mountPath: /community/cfg/aes.keyfile

# -- `nifi` subchart values (see https://github.com/opentext-idol/idol-containers-toolkit/tree/main/helm/idol-nifi#values)
# @default -- default configuration for search-abstractor nifi
nifi:
  # -- Whether to deploy a NiFi instance
  enabled: true
  idolImage:
    repo: nifi-ver2-searchabstractor
    version: *idolVersion
  additionalVolumes:
    search-abstractor-nifi-files:
      name: search-abstractor-nifi-files
      configMap:
        name: search-abstractor-nifi-deployment-files
  additionalVolumeMounts:
    search-abstractor-nifi-files:
      name: search-abstractor-nifi-files
      mountPath: /opt/nifi/nifi-current/search_abstractor
  nifiRegistry:
    buckets:
      default-bucket:
        DELETE: true
      search-abstractor-flows-bucket:
        name: &flowsBucket search-abstractor-flows-bucket
        flowfiles:
        - /opt/nifi/nifi-current/search_abstractor/Query_flow.json
        - /opt/nifi/nifi-current/search_abstractor/Ingest_flow.json
  nifiClusters:
    idol-nifi:
      # base Search Abstractor setup deploys a single nifi instance with both query and ingest flow
      clusterId: &nifiClusterId idol-nifi
      flows:
        basic-idol:
          DELETE: true
        query-flow:
          name: "Search Abstractor Query Flow"
          bucket: *flowsBucket
        ingest-flow:
          name: "Search Abstractor Ingest Flow"
          bucket: *flowsBucket
      service:
        # this service required by query flow
        additionalPorts:
          saApiListener:
            name: sa-api-port
            port: &sa-api-port 8085 # must match saapi.backendApi.port
  nifi:
    autoScaling:
      enabled: false

# -- `view` subchart values (see https://github.com/opentext-idol/idol-containers-toolkit/tree/main/helm/idol-view#values)
# @default -- default configuration for search-abstractor view
view:
  # -- Whether to deploy a View component
  enabled: true
  idolImage:
    version: "25.2.2"
  queryserviceACIPort: *queryserviceACIPort
  queryserviceSSLMethod: None
  nifiserviceName: *nifiClusterId   # Should be pointed at the ingestion nifi service
  existingConfigMap: search-abstractor-view-deployment-cfg

# -- PostgreSQL subchart for OTDS. (see https://github.com/bitnami/charts/tree/main/bitnami/postgresql)
# @default -- default configuration for OTDS PostgreSQL
otdsdb:
  enabled: true
  fullnameOverride: otds-psqldb
  service:
    port: 5432
  auth:
    username: &otds-db-username isol-db
    password: &otds-db-password isol-db
    database: otdsdb

# -- auth service values
# @default -- default configuration for auth service
auth:
  # -- whether to deploy OTDS component
  # If you are not deploying OTDS here, you still need to configure values as if it was being deployed and set this to false
  enabled: true
  # -- OTDS sub chart values
  # @default -- See also OTDS chart default values
  otdsws:
    ingress:
      # -- Ingress prefix for OTDS. e.g. eventually resolves as proto://host.name:port/prependPath/otdsws
      prependPath: "OTDS"
    otdsdb:
      url: jdbc:postgresql://otds-psqldb:5432/otdsdb
      username: *otds-db-username
      password: *otds-db-password
    image:
      source: registry.opentext.com
      pullSecret: opentext
    adminEmail: discover.admin
    adminPassword: discover.admin.123!
    cryptKey: MTIzNDU2Nzg5YWNiZGVmZw==
    enableBootstrapConfig: false

  # -- Whether to initialize OTDS with the partition and clients
  initEnabled: true
  # -- if true removes restrictions on password strength
  # only for use in testing
  simplePasswordPolicy: false
  # -- partition in the authentication server to configure and use
  partition: discover
  # -- Discover administrator user to create as part of system initialization
  createAdminUsername: admin.user
  # -- password for Discover administrator user to create as part of system initialization
  createAdminPassword: admin.user.123!
  # -- Optional path to file to populate additional users from
  usersFile: ""
  # -- Client to use for API requests. Configured using OTDS creds if not existing (see auth.otdsws.adminEmail/adminPassword)
  apiClient: discover_api
  # -- Client credentials for API requests. Configured using OTDS creds if not existing (see auth.otdsws.adminEmail/adminPassword)
  apiClientSecret: d0e76ad7-7d6b-4d86-be3a-5dfe715dbf87
  # -- Client to use for OGS requests. Should be created in advance by an OTDS admin.
  ogsClient: otds-ogs-client
  # -- Client credentials for OGS requests. Should be provided by the OTDS admin after creating the OGS client.
  ogsClientSecret: ""
  # -- Client to configure and use for logging into the UI
  uiClient: discover_ui
  # -- URL to redirect to post authorization
  uiUrls: "http://localhost:4200/.*"
  # -- Expiry time in seconds for login tokens
  tokenExpiryTimeSeconds: 300
  # -- Expiry time in seconds for refresh tokens
  refreshTokenExpiryTimeSeconds: 86400
  # -- Roles to populate in OTDS
  baseRealmRoles: user
  external:
    # -- External hostname for OTDS instance (e.g. host.name)
    host:
    # -- External port number of OTDS instance (e.g. 8080)
    port:
    # -- Protocol for OTDS communication (http/https)
    protocol: http
  userSecurity:
    # -- Security Repository in Community to use for UserRead authentication
    repository: OTDS
    # -- OTDS Resource ID to supply on UserRead authentication requests
    resourceId: ""
    # -- Field from decoded JWT for Community to compare against username
    jwtUserField: name

# -- PostgreSQL subchart values (see https://github.com/bitnami/charts/tree/main/bitnami/postgresql)
# @default -- default configuration for search-abstractor session api PostgreSQL
saapiPostgresql:
  fullnameOverride: saapi-postgresql
  # -- Whether to deploy the PostgreSQL subchart for the session api service
  enabled: true
  service:
    # -- Port session API PostgreSQL service runs on
    port: 5432
  auth:
    username: postgres
    password: postgres
    database: sessionsdb
  
  primary:
    persistence:
      storageClass: standard
    containerSecurityContext:
      enabled: true
    podSecurityContext:
      enabled: true
    initdb:
      user: postgres
      password: postgres
      scriptsConfigMap: session-api-postgres-cfg-map

sessionapi:
  # -- Deployment name
  name: &saapi-session-name saapi-session-api-service
  # -- Deployment replicas
  replicas: 1
  image:
    # -- The registry value to use to construct the container image name: {registry}/{repo}:{version}
    registry: microfocusidolserver
    # -- The repository value to use to construct the container image name: {registry}/{repo}:{version}
    repo: search-abstractor-session-service
    # -- The version value to use to construct the container image name: {registry}/{repo}:{version}
    version: &saVersion "25.2.4"
    # -- The policy to use to determine whether to pull the specified image (see https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy)
    pullPolicy: Always
  security:
    # -- Optional path within the container to load trusted TLS certificates from
    trustedCertsPath: ""
  service:
    # -- Session service name
    name: *saapi-session-name
    # -- Port that the session service runs on
    port: 8080
  licensor:
    # -- Session licensor name
    name: idol-answerserver
    # -- Port session licensor runs on
    port: 12000
  # -- `configmap` name
  config: session-api-config
  # -- Secret name for auth credentials
  secret: session-api-secret
  ingress:
    # -- Whether to create an ingress resource
    enabled: false
    # -- Ingress controller path exposing session API
    path: /session-api/
    # -- Optional ingress host (see https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-rules).
    host: ""
    # -- Optional parameter to override the default ingress class
    className: ""
  # -- Optional resources for Search Abstractor session API container (see https://kubernetes.io/docs/concepts/configuration/manage-resources-containers)
  resources:
    # -- enable resources for Search Abstractor session API container. Setting to false disables this.
    enabled: false
    limits:
      cpu: 200m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 1Gi
  # -- Additional PodSpec Volume(s) (see <https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#volumes>)
  # Typical usage might be to mount in custom TLS certificates
  # dict of (name, Volume)
  additionalVolumes: {}

  # -- Additional PodSpec VolumeMount(s) (see <https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#volumes-1>)
  # Typical usage might be to mount in custom TLS certificates
  # dict of (name, VolumeMount)
  additionalVolumeMounts: {}

saapi:
  # -- Deployment name
  name: &saapi-name saapi-api-service
  # -- Deployment replicas
  replicas: 1
  image:
    # -- The registry value to use to construct the container image name: {registry}/{repo}:{version}
    registry: microfocusidolserver
    # -- The repository value to use to construct the container image name: {registry}/{repo}:{version}
    repo: search-abstractor-api-service
    # -- The version value to use to construct the container image name: {registry}/{repo}:{version}
    version: *saVersion
     # -- The policy to use to determine whether to pull the specified image (see https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy)
    pullPolicy: Always
  management:
    # -- base path for management functions; e.g. healthcheck (must begin and end with a slash)
    basePath: /actuator/
  # -- CORS origin values
  allowedOrigins: "http://localhost:8080"
  # -- Cache duration, in seconds, for document images and subfiles
  httpCacheMaxAge: 3600
  # -- Hostname for Community component
  backendIdolHost: *community-name
  # -- ACI port for Community component
  backendIdolPort: *community-aciport
  # -- hostname for Content component
  backendIdolContentHost: idol-qms
  # -- aci port for content component
  backendIdolContentPort: *qms-aci-port
  # -- are we using the Discover index for document storage?
  usingDiscoverIndex: false
  # -- Optional resources for Search Abstractor API container (see https://kubernetes.io/docs/concepts/configuration/manage-resources-containers)
  resources:
    # -- enable resources for Search Abstractor API container. Setting to false disables this.
    enabled: false
    limits:
      cpu: 200m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 1Gi
  backendApi:
    # -- Host/service name. Should point at query nifi service
    name: *nifiClusterId
    # -- Port
    port: *sa-api-port
    ingress:
      # -- Whether to create a backend API ingress resource. Neither recommended nor required in normal operation.
      enabled: false
      # -- Optional host (see https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-rules).
      host: ""
      # -- Optional parameter to override the default ingress class
      className: ""
  storage:
    # -- Database name used for api-service storage
    dbName: resourcesdb
    # -- Maximum size for a single uploaded file
    maxFileSize: 10MB
    # -- Maximum total size for a request
    maxRequestSize: 10MB
  # -- `configmap` name
  config: api-config
  # -- Secret name for auth credentials
  secret: api-secret
  ingress:
    # -- Ingress controller path exposing API (should end with /)
    path: /api/
    # -- Optional ingress host (see https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-rules).
    host: ""
    # -- Port ingress service runs on
    port: 12080
    # -- Optional parameter to override the default ingress class
    className: ""
  security:
    # -- Optional path within the container to load trusted TLS certificates from
    trustedCertsPath: ""

  # -- Additional PodSpec Volume(s) (see <https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#volumes>)
  # Typical usage might be to mount in custom TLS certificates
  # dict of (name, Volume)
  additionalVolumes: {}

  # -- Additional PodSpec VolumeMount(s) (see <https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#volumes-1>)
  # Typical usage might be to mount in custom TLS certificates
  # dict of (name, VolumeMount)
  additionalVolumeMounts: {}

  service:
    # -- Service name
    name: *saapi-name
    # -- Port service runs on
    port: 8080
    # -- Port service runs on for management
    managePort: 8081

  vertexai:
    # -- Should we use VertexAI, rather than vLLM, for LLM support?
    enabled: false
    # -- Project name for VertexAI client to use for API calls
    project: "otl-csd-architecture"
    # -- Location for VertexAI client to use for API calls
    location: "us-east4"
    # -- Name of generative model to use with VertexAI
    model: "gemini-1.5-flash-001"
    # -- Limit the number of output tokens returned by the Generative model
    maxOutputTokens: 500
    # -- How to authenticate the VertexAI client with Google Cloud; can be "serviceAccount" or "credentials"
    authentication: "credentials"
    # -- Application credentials for VertexAI client API calls, used if `authentication` is "credentials".
    # Will be used to initialize a Google service account Credentials instance; see
    # https://google-auth.readthedocs.io/en/master/reference/google.oauth2.service_account.html#google.oauth2.service_account.Credentials.from_service_account_file
    credentials:
      type: "service_account"
      project_id: ""
      private_key_id: ""
      private_key: ""
      client_email: ""
      client_id: ""
      auth_uri: "https://accounts.google.com/o/oauth2/auth"
      token_uri: "https://oauth2.googleapis.com/token"
      auth_provider_x509_cert_url: "https://www.googleapis.com/oauth2/v1/certs"
      client_x509_cert_url: "https://www.googleapis.com/robot/v1/metadata/x509/svc-vertex-aviator%40otl-csd-architecture.iam.gserviceaccount.com"
      universe_domain: "googleapis.com"

  vllm:
    # -- vllm endpoint to use for llm access
    endpoint: http://vllm-endpoint:8000/v1/completions
    # -- vllm chat endpoint to use for llm access
    chatEndpoint: http://vllm-endpoint:8000/v1/chat/completions
    # -- The LLM to use
    model: mistralai/Mistral-7B-Instruct-v0.2
    # -- The LLM revision to use (branch, tag, or commitid)
    modelRevision: "99259002b41e116d28ccb2d04a9fbe22baed0c7f"
    # -- HuggingFace token to access the model/tokenizer to use for the RAG answer system
    HFToken: &hf-token ""
    # -- The LLaVa model to use
    llavaModel: "llava-hf/llava-v1.6-mistral-7b-hf"
    # -- The base path of the OpenAI endpoint to use for LLaVa model access
    llavaEndpointBase: "http://openai-llava-server:8000/v1/"
    # -- The OpenAI API key to use for the endpoint
    openAiApiKey: "My API Key"
  javaOpts: ""

# -- VLLM subchart values (see https://github.com/substratusai/helm/blob/main/charts/vllm/README.md) - not enabled by default
# @default -- default configuration for search-abstractor VLLM deployment
vllmdeployment:
  enabled: false
  nameOverride: vllm-deployment-sa
  fullnameOverride: vllm-deployment-sa
  model: mistralai/Mistral-7B-Instruct-v0.2
  runtimeClassName: nvidia
  gpuMemoryUtilization: 0.40
  image:
    tag: v0.5.0
  ingress:
    enabled: true
    hosts:
    - host: ""
      paths:
        - path: /
          pathType: ImplementationSpecific
  env:
    - name: HF_TOKEN
      value: *hf-token
  resources:
    limits:
      nvidia.com/gpu: 1

# -- VLLM subchart values (see https://github.com/substratusai/helm/blob/main/charts/vllm/README.md) - not enabled by default
# @default -- default configuration for search-abstractor Llava deployment
llavadeployment:
  enabled: false
  nameOverride: llava-deployment-sa
  fullnameOverride: llava-deployment-sa
  model: llava-hf/llava-v1.6-mistral-7b-hf
  runtimeClassName: nvidia
  gpuMemoryUtilization: 0.40
  image:
    tag: v0.5.0
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 64m
    hosts:
    - host: ""
      paths:
        - path: /
          pathType: ImplementationSpecific
  env:
    - name: HF_TOKEN
      value: *hf-token
    - name: EXTRA_ARGS
      value: --image-input-type pixel_values --image-token-id 32000 --image-input-shape 1,3,336,336 --image-feature-size 1176 --max-model-len 21000
  resources:
    limits:
      nvidia.com/gpu: 1

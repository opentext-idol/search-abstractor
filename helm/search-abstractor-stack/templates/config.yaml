apiVersion: v1
kind: ConfigMap
metadata:
  name: search-abstractor-answerserver-deployment-resources-cfg
  labels: {{- include "idol-library.labels" (dict "root" . "component" .Values.answerserver ) | nindent 4 }}
data:
  prompt_template.txt: |
{{ tpl (print "resources/prompt_template.txt" | .Files.Get) . | indent 4 }}
  topic_template.txt: |
{{ tpl (print "resources/topic_template.txt" | .Files.Get) . | indent 4}}
  vertex.py: |
{{ tpl (print "resources/vertex.py" | .Files.Get) . | indent 4 }}
  vllm.py: |
{{ tpl (print "resources/vllm.py" | .Files.Get) . | indent 4 }}
  llama.py: |
{{ tpl (print "resources/llama.py" | .Files.Get) . | indent 4 }}
  conversation_tasks.json: |
{{ tpl (print "resources/conversation_tasks.json" | .Files.Get) . | indent 4 }}
  {{- if eq .Values.saapi.vertexai.authentication "credentials" }}
  google_cloud_credentials.json: |
{{ mustToPrettyJson .Values.saapi.vertexai.credentials | indent 4 }}
  {{- else if ne .Values.saapi.vertexai.authentication "serviceAccount" }}
{{- fail "VertexAI authentication must be `credentials` or `serviceAccount`" }}
  {{- else if not .Values.answerserver.serviceAccountName }}
{{- fail "AnswerServer serviceAccountName must be set for VertexAI serviceAccount authentication" }}
  {{- end}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: search-abstractor-answerserver-deployment-env-cfg
  labels: {{- include "idol-library.labels" (dict "root" . "component" .Values.answerserver ) | nindent 4 }}
data:
  {{- if .Values.saapi.vllm.model }}
  OPENTEXT_VLLM_MODEL: {{ .Values.saapi.vllm.model }}
  {{- if .Values.saapi.vllm.modelRevision }}
  OPENTEXT_VLLM_MODEL_REVISION: {{ .Values.saapi.vllm.modelRevision | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.vllmdeployment.enabled }}
  OPENTEXT_VLLM_ENDPOINT: "http://{{ .Values.vllmdeployment.nameOverride }}:{{ .Values.vllmdeployment.service.port }}/v1/completions"
  {{- else if .Values.saapi.vllm.endpoint }}
  OPENTEXT_VLLM_ENDPOINT: {{ .Values.saapi.vllm.endpoint }}
  {{- end }}
  {{- if .Values.vllmdeployment.enabled }}
  OPENTEXT_VLLM_CHAT_ENDPOINT: "http://{{ .Values.vllmdeployment.nameOverride }}:{{ .Values.vllmdeployment.service.port }}/v1/chat/completions"
  {{- else if .Values.saapi.vllm.chatEndpoint }}
  OPENTEXT_VLLM_CHAT_ENDPOINT: {{ .Values.saapi.vllm.chatEndpoint }}
  {{- end }}
  {{- if .Values.saapi.vllm.HFToken }}
  OPENTEXT_HUGGINGFACE_API_TOKEN: {{ .Values.saapi.vllm.HFToken }}
  {{- end }}
  {{- if .Values.saapi.vertexai.project }}
  OPENTEXT_VERTEX_PROJECT: {{ .Values.saapi.vertexai.project }}
  {{- end}}
  {{- if .Values.saapi.vertexai.location }}
  OPENTEXT_VERTEX_LOCATION: {{ .Values.saapi.vertexai.location }}
  {{- end}}
  {{- if .Values.saapi.vertexai.model }}
  OPENTEXT_VERTEX_MODEL: {{ .Values.saapi.vertexai.model }}
  {{- end}}
  {{- if eq .Values.saapi.vertexai.authentication "credentials" }}
  OPENTEXT_VERTEX_CREDENTIALS: "/answerserver/resources/llmdata/google_cloud_credentials.json"
  {{- end}}
  {{- if .Values.saapi.llama.enabled }}
  {{- if .Values.saapi.llama.endpointBase }}
  OPENTEXT_LLAMA_ENDPOINT_BASE: {{ .Values.saapi.llama.endpointBase }}
  {{- end }}
  {{- if .Values.saapi.llama.model }}
  OPENTEXT_LLAMA_MODEL: {{ .Values.saapi.llama.model }}
  {{- if .Values.saapi.llama.modelRevision }}
  OPENTEXT_LLAMA_MODEL_REVISION: {{ .Values.saapi.llama.modelRevision | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.saapi.llama.apiKey }}
  OPENTEXT_LLAMA_API_KEY: {{ .Values.saapi.llama.apiKey }}
  {{- end }}
  {{- if .Values.saapi.llama.hfModel }}
  OPENTEXT_LLAMA_HUGGINGFACE_MODEL: {{ .Values.saapi.llama.hfModel }}
  {{- end }}
  {{- if .Values.saapi.llama.hfToken }}
  OPENTEXT_LLAMA_HUGGINGFACE_API_TOKEN: {{ .Values.saapi.llama.hfToken }}
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: search-abstractor-ogs-deployment-oauth-cfg
  labels: {{- include "idol-library.labels" (dict "root" . "component" .Values.ogs ) | nindent 4 }}
data:
  oauth_tool.cfg: |
{{ tpl (print "resources/oauth_tool.cfg" | .Files.Get) . | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: search-abstractor-security-aes-key
  labels: {{- include "idol-library.labels" (dict "root" . "component" .Values ) | nindent 4 }}
data:
  aes.keyfile: |-
{{ sha256sum .Values.aes.key | indent 4 }}

{{- define "searchabstractor.configmap" }}
{{- $root := get . "root" | required "searchabstractor.configmap missing root" -}}
{{- $name := get . "name" | required "searchabstractor.configmap missing name" -}}
{{- $component := get . "component" | required "searchabstractor.configmap missing component" -}}
{{- $useComponentValues := dig "useComponentValues" false . -}}
{{- $filename := get . "filename" | required "searchabstractor.configmap missing filename" -}}
{{- $file := dig "file" (print "resources/" $filename) . -}}
{{- $enabled := dig "enabled" $component.enabled . -}}
{{- if and $enabled (eq $component.existingConfigMap $name) -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "idol-library.labels" (dict "root" $root "component" $component ) | nindent 4 }}
data:
  {{ $filename }}: |-
{{ tpl (print $file | $root.Files.Get) (ternary $component $root $useComponentValues) | indent 4 }}
{{- end }}
{{- end }}

{{- if and .Values.content.enabled .Values.distributedidol.enabled }}
{{- fail "single-content and distributedidol should not both be enabled." }}
{{- end }}

{{/* Search Abstractor configmaps for ACI Server config files (unless overridden by user) */}}
{{ range $vals := list 
  (dict "root" . "name" "search-abstractor-answerserver-deployment-cfg" "component" .Values.answerserver "filename" "answerserver.cfg" )
  (dict "root" . "name" "search-abstractor-content-deployment-cfg" "component" (ternary .Values.distributedidol.content .Values.content .Values.distributedidol.enabled) "filename" "content.cfg" "enabled" (or .Values.content.enabled .Values.distributedidol.enabled) "useComponentValues" true )
  (dict "root" . "name" "search-abstractor-distributed-idol-dah-deployment-cfg" "component" .Values.distributedidol.dah "filename" "dah.cfg" "enabled" .Values.distributedidol.enabled )
  (dict "root" . "name" "search-abstractor-distributed-idol-dih-deployment-cfg" "component" .Values.distributedidol.dih "filename" "dih.cfg" "enabled" .Values.distributedidol.enabled )
  (dict "root" . "name" "search-abstractor-community-deployment-cfg" "component" .Values.community "filename" "community.cfg" )
  (dict "root" . "name" "search-abstractor-ogs-deployment-cfg" "component" .Values.ogs "filename" "omnigroupserver.cfg" )
  (dict "root" . "name" "search-abstractor-qms-deployment-cfg" "component" .Values.qms "filename" "qms.cfg" )
  (dict "root" . "name" "search-abstractor-view-deployment-cfg" "component" .Values.view "filename" "view.cfg" )
}}
{{ include "searchabstractor.configmap" $vals }}
{{ end }}
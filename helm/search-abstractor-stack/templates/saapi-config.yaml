apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.saapi.config }}
data:
  SERVER_SERVLET_CONTEXT_PATH: "{{ .Values.saapi.ingress.path }}"
  SEARCH_ABSTRACTOR_MGMT_BASE_PATH: {{ .Values.saapi.management.basePath | trimSuffix "/" | quote }}
  ISOL_AUTH_SERVICE_PARTITION: "{{ .Values.auth.partition }}"
  ISOL_OTDS_AUTH_SERVICE_PROTOCOL: "{{ .Values.auth.external.protocol }}"
  ISOL_OTDS_AUTH_SERVICE_HOST: "{{ .Values.auth.external.host }}"
  ISOL_OTDS_AUTH_SERVICE_PORT: "{{ .Values.auth.external.port }}"
  ISOL_OTDS_AUTH_SERVICE_URL: "{{- include "auth.urlNorm" (dict "external" .Values.auth.external "path" .Values.auth.otdsws.ingress.prependPath) -}}"
  ISOL_OTDS_AUTH_SERVICE_PATH: "{{- if .Values.auth.otdsws.ingress.prependPath -}}/{{- .Values.auth.otdsws.ingress.prependPath -}}{{- end -}}"
  ISOL_AUTH_SERVICE_INIT_ENABLED: {{ .Values.auth.initEnabled | quote }}
  ISOL_OTDS_AUTH_SERVICE_INIT_CONFIG_PATH: "/data/auth-setup/"
  SEARCH_ABSTRACTOR_API_JAVA_OPTS: "{{ .Values.saapi.javaOpts }}"
  SEARCH_ABSTRACTOR_IDOL_COMMUNITY_HOST: "{{ .Values.saapi.backendIdolHost }}"
  SEARCH_ABSTRACTOR_IDOL_COMMUNITY_PORT: "{{ .Values.saapi.backendIdolPort }}"
  SEARCH_ABSTRACTOR_IDOL_COMMUNITY_REPOSITORY: "{{ .Values.auth.userSecurity.repository}}"
  SEARCH_ABSTRACTOR_IDOL_COMMUNITY_RESOURCEID: "{{ .Values.auth.userSecurity.resourceId}}"
  SEARCH_ABSTRACTOR_IDOL_CONTENT_HOST: "{{ .Values.saapi.backendIdolContentHost }}"
  SEARCH_ABSTRACTOR_IDOL_CONTENT_PORT: "{{ .Values.saapi.backendIdolContentPort }}"
  SEARCH_ABSTRACTOR_IDOL_ANSWERSERVER_HOST: "{{ .Values.saapi.backendIdolAnswerServerHost }}"
  SEARCH_ABSTRACTOR_IDOL_ANSWERSERVER_PORT: "{{ .Values.saapi.backendIdolAnswerServerPort }}"
  SEARCH_ABSTRACTOR_IDOL_ANSWERSERVER_SYSTEM_ORDERING: "{{ .Values.saapi.backendIdolAnswerServerSystemOrdering }}"
  SEARCH_ABSTRACTOR_IDOL_USING_DISCOVER_INDEX: {{ .Values.saapi.usingDiscoverIndex | quote }}
  SEARCH_ABSTRACTOR_IDOL_VIEW_HOST: "{{ .Values.saapi.backendIdolViewHost }}"
  SEARCH_ABSTRACTOR_IDOL_VIEW_PORT: "{{ .Values.saapi.backendIdolViewPort }}"
  SEARCH_ABSTRACTOR_IDOL_VIEW_URL_PREFIX: "http://{{ .Values.saapi.ingress.host }}:{{ .Values.saapi.ingress.port }}{{ .Values.saapi.ingress.path }}document/html/subfile?linkspec="
  SEARCH_ABSTRACTOR_HTTP_CACHE_MAX_AGE: "{{ .Values.saapi.httpCacheMaxAge }}"
  SEARCH_ABSTRACTOR_SESSION_LICENSOR_HOST: "{{ .Values.saapi.sessionLicensor.name }}"
  SEARCH_ABSTRACTOR_SESSION_LICENSOR_PORT: "{{ .Values.saapi.sessionLicensor.port }}"
  SEARCH_ABSTRACTOR_SERVER_ALLOWED_ORIGINS: "{{ .Values.saapi.allowedOrigins }}"
  SEARCHABSTRACTOR_API_SERVICE_DATABASE_HOST: {{ .Values.saapiPostgresql.fullnameOverride | quote }}
  SEARCHABSTRACTOR_API_SERVICE_DATABASE_PORT: {{ .Values.saapiPostgresql.service.port | quote }}
  SEARCHABSTRACTOR_API_SERVICE_DATABASE_USERNAME: {{ .Values.saapiPostgresql.auth.username | quote }}
  SEARCHABSTRACTOR_API_SERVICE_DATABASE_PASSWORD: {{ .Values.saapiPostgresql.auth.password | quote }}
  SEARCHABSTRACTOR_API_SERVICE_DATABASE_NAME: {{ .Values.saapi.storage.dbName | quote }}
  SEARCH_ABSTRACTOR_TRUSTED_CERTS_PATH: {{ .Values.saapi.security.trustedCertsPath | quote }}
  SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: {{ .Values.saapi.storage.maxFileSize | quote }}
  SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: {{ .Values.saapi.storage.maxRequestSize | quote }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: session-api-postgres-cfg-map
data:
  init_script.sql: |+
    CREATE DATABASE {{ .Values.saapi.storage.dbName }};
    GRANT ALL PRIVILEGES ON DATABASE {{ .Values.saapi.storage.dbName }} to {{ .Values.saapiPostgresql.auth.username }}

---

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.saapi.secret }}
data:
  ISOL_AUTH_SERVICE_API_CLIENT_SECRET: "{{ .Values.auth.apiClientSecret | b64enc }}"
  ISOL_AUTH_SERVICE_ADMIN_USER: "{{ .Values.auth.otdsws.adminEmail  | b64enc }}"
  ISOL_AUTH_SERVICE_ADMIN_PASS: "{{ .Values.auth.otdsws.adminPassword  | b64enc }}"
{{ range $name, $value :=.Values.auth.additionalSecrets -}}
  {{ $name | indent 2}}: "{{ $value | b64enc }}"
{{ end }}

// patching config file
// idol_ssl.cfg is written by run_idol.sh with SSL settings if required by IDOL_SSL env variable
// original.content.cfg is the config file as contained in the standard component zip

// modified config sections

< "/content/cfg/idol_ssl.cfg" [SSLSettings]

[License] < "/content/cfg/content.cfg" [License]
LicenseServerHost={{ .Values.content.licenseServerHostname }}

[Service] < "/content/cfg/content.cfg" [Service]

[Server] < "/content/cfg/content.cfg" [Server]
< "idol_ssl.cfg" [EnableSSL] SSLConfig
AdvancedSearch=True
CollectFieldStatistics=True
DateFormatCSVs=#ISODATETIME,SHORTMONTH#SD+#SYYYY,HH:NN:SS#SDD/MM/#Y,DD/MM/YYYY,YYYY/MM/DD,YYYY-MM-DD,AUTNDATE
MaxInputString=-1

[IndexServer] < "/content/cfg/content.cfg" [IndexServer]
< "idol_ssl.cfg" [EnableSSL] SSLConfig

[AuthorizationRoles] < "/content/cfg/content.cfg" [AuthorizationRoles]

[AdminRole] < "/content/cfg/content.cfg" [AdminRole]

[QueryRole] < "/content/cfg/content.cfg" [QueryRole]

[IndexRole] < "/content/cfg/content.cfg" [IndexRole]

[Logging] < "/content/cfg/content.cfg" [Logging]
LogMaxLineLength=1000000

[Databases] < "/content/cfg/content.cfg" [Databases]

[Database0] < "/content/cfg/content.cfg" [Database0]

[Database1] < "/content/cfg/content.cfg" [Database1]

[VectorIndex]
DistanceMetric=L2

[Security]
SecurityInfoKeys=/opt/idol/content/index/aes.keyfile
{{ .Values.content.cfg.security }}


[FieldProcessing] < "/content/cfg/content.cfg" [FieldProcessing]
29=VectorFields
30=ImageVectorFields
{{ .Values.content.cfg.fieldprocessing }}

[VectorFields]
Property=VectorFields
PropertyFieldCSVs=*/VECTOR*
PropertyNegativeFieldCSVs=*/VECTOR_CLIP-VIT-B-32
VectorType=TRUE

[ImageVectorFields]
Property=ImageVectorFields
PropertyFieldCSVs=*/VECTOR_CLIP-VIT-B-32
VectorType=True
DistanceMetric=Cosine

// unmodified config sections

[IndexCache] < "/content/cfg/content.cfg" [IndexCache]
[Paths] < "/content/cfg/content.cfg" [Paths]
[SetReferenceFields] < "/content/cfg/content.cfg" [SetReferenceFields]
[SetParentReferenceFields] < "/content/cfg/content.cfg" [SetParentReferenceFields]
[SetRootFamilyReferenceFields] < "/content/cfg/content.cfg" [SetRootFamilyReferenceFields]
[SetRootParentReferenceFields] < "/content/cfg/content.cfg" [SetRootParentReferenceFields]
[SetAutnIdentifierFields] < "/content/cfg/content.cfg" [SetAutnIdentifierFields]
[SetUUIDFields] < "/content/cfg/content.cfg" [SetUUIDFields]
[SetVNodeReferenceField] < "/content/cfg/content.cfg" [SetVNodeReferenceField]
[SetSectionBreakFields] < "/content/cfg/content.cfg" [SetSectionBreakFields]
[SetDateFields] < "/content/cfg/content.cfg" [SetDateFields]
PropertyFieldCSVs=*/DREDATE,*/DATE,*/REPOSITORY_METADATA_DATE_MODIFIED_EPOCHSECONDS,*/DOCUMENT_METADATA_DATE_MODIFIED_EPOCHSECONDS,*/FILEMODIFIEDTIME,*/LASTMODIFIED,*/PART_FILE_META_LASTSAVE_DTM,*/PART_FILE_META_MODIFIED

[SetDatabaseFields] < "/content/cfg/content.cfg" [SetDatabaseFields]
[SetAutnRankFields] < "/content/cfg/content.cfg" [SetAutnRankFields]
[SetAclFields] < "/content/cfg/content.cfg" [SetAclFields]

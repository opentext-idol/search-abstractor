[SetSourceFields] < "/content/cfg/content.cfg" [SetSourceFields]
[SetFieldCheckFields] < "/content/cfg/content.cfg" [SetFieldCheckFields]
[SetNumericFields] < "/content/cfg/content.cfg" [SetNumericFields]
PropertyFieldCSVs=*/*_NUM,*/NUMBER,*/NUM_*,*/DOCUMENT_METADATA_FILESIZE_BYTES,*/REPOSITORY_METADATA_FILESIZE_BYTES,*/LATITUDE,*/LONGITUDE,*/*_FILESIZE_BYTES,*/*_PAGECOUNT,*/PART_KEYVIEW_EMBEDDEDFONT_MISMATCHPROBABILITY,*/PART_KEYVIEW_EMBEDDEDFONT_PERCENTAGE,*/PART_KEYVIEW_EMBEDDEDFONT_RATIO
PropertyNegativeFieldCSVs=*/*_KEYVIEW_TYPE_NUMBER,*/*_ERROR_CODE_NUMBER

[SetNumericDateFields] < "/content/cfg/content.cfg" [SetNumericDateFields]
PropertyFieldCSVs=*/*_NUMDATE,*/DOCUMENT_METADATA_DATE_*_EPOCHSECONDS,*/REPOSITORY_METADATA_DATE_*_EPOCHSECONDS,*/PART_FILE_META_LASTSAVE_DTM,*/PART_FILE_META_MODIFIED,*/MYDATE

[SetParametricFields] < "/content/cfg/content.cfg" [SetParametricFields]
PropertyFieldCSVs=*/PII_*/VALUE,*/*_PARAM,*/IMPORTMAGICEXTENSION,*/AUTHOR,*/PARAM_*,*/DOCUMENT_KEYVIEW_CONTENTTYPE_STRING,*/DOCUMENT_METADATA_AUTHOR_STRING,*/DOCUMENT_METADATA_CREATOR_STRING,*/DOCUMENT_METADATA_FROM_STRING,*/DOCUMENT_METADATA_TO_STRING,*/DOCUMENT_METADATA_PRIORITY_STRING,*/DOCUMENT_METADATA_HASATTACHMENTS_BOOLEAN,*/CATEGORY_TITLE,*/*_KEYVIEW_CLASS_STRING,*/*_KEYVIEW_CLASS,*/*_KEYVIEW_FORMAT,*/*_KEYVIEW_TYPE_NUMBER,*/*_KEYVIEW_PROCESSING_ERROR_CODE


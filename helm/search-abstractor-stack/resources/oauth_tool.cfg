[Default]
TempDirectory=.
ProxyHost=
ProxyPort=

[OTDS]
SiteName=OpentextDirectoryServices
OAuthVersion=2.0
AuthorizationType=OpentextDirectoryServicesAuthorization
RetrieveTokens=false
SSLMethod={{ include "otds.sslmethod" (dict "root" . "auth" .Values.auth) }}
TokenUrl={{ include "otds.endpoint" (dict "root" . "auth" .Values.auth) }}/otdsws/oauth2/token
AppKey={{ .Values.auth.ogsClient }}
AppSecret={{ .Values.auth.ogsClientSecret }}
CustomName0=username
CustomValue0={{ .Values.auth.otdsws.adminEmail }}
CustomName1=password
CustomValue1={{ .Values.auth.otdsws.adminPassword }}

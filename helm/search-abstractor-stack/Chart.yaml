apiVersion: v2
appVersion: 25.2.4
dependencies:
- alias: content
  condition: content.enabled
  name: single-content
  repository: https://raw.githubusercontent.com/opentext-idol/idol-containers-toolkit/main/helm
  version: ~0.11.0
- alias: distributedidol
  condition: distributedidol.enabled
  name: distributed-idol
  repository: https://raw.githubusercontent.com/opentext-idol/idol-containers-toolkit/main/helm
  version: ~0.13.0
- alias: idol-library
  name: idol-library
  repository: https://raw.githubusercontent.com/opentext-idol/idol-containers-toolkit/main/helm
  version: ~0.15.0
- alias: qms
  condition: qms.enabled
  name: idol-qms
  repository: https://raw.githubusercontent.com/opentext-idol/idol-containers-toolkit/main/helm
  version: ~0.7.0
- alias: answerserver
  condition: answerserver.enabled
  name: idol-answerserver
  repository: https://raw.githubusercontent.com/opentext-idol/idol-containers-toolkit/main/helm
  version: ~0.5.0
- alias: view
  condition: view.enabled
  name: idol-view
  repository: https://raw.githubusercontent.com/opentext-idol/idol-containers-toolkit/main/helm
  version: ~0.7.0
- alias: ogs
  condition: ogs.enabled
  name: idol-omnigroupserver
  repository: https://raw.githubusercontent.com/opentext-idol/idol-containers-toolkit/main/helm
  version: ~0.8.0
- alias: community
  condition: community.enabled
  name: idol-community
  repository: https://raw.githubusercontent.com/opentext-idol/idol-containers-toolkit/main/helm
  version: ~0.7.0
- alias: nifi
  condition: nifi.enabled
  name: idol-nifi
  repository: https://raw.githubusercontent.com/opentext-idol/idol-containers-toolkit/main/helm
  version: ~0.15.0
- alias: otdsdb
  condition: otdsdb.enabled
  name: postgresql
  repository: '@bitnami'
  version: 16.2.1
- alias: auth
  condition: auth.enabled
  name: otds
  repository: https://registry.opentext.com/helm
  version: 24.4.0
- alias: saapiPostgresql
  condition: saapiPostgresql.enabled
  name: postgresql
  repository: '@bitnami'
  version: 16.2.1
- alias: vllmdeployment
  condition: vllmdeployment.enabled
  name: vllm
  repository: '@substratusai'
  version: 0.5.5
- alias: llavadeployment
  condition: llavadeployment.enabled
  name: vllm
  repository: '@substratusai'
  version: 0.5.5
description: An IDOL setup for RAG
name: search-abstractor-stack
version: 25.2.4
